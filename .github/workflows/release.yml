name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == go1.26.* ]]
          [[ "$(go env GOTOOLCHAIN)" == "local" ]]

          version_lines="$(awk 'END { print NR }' VERSION)"
          version="$(awk 'NR == 1 { sub(/\r$/, ""); print }' VERSION)"
          if [[ "$version_lines" -ne 1 ]] ||
            [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain exactly one major.minor.patch line."
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] ||
            [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION ${version}."
            exit 1
          fi

          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit ${head_commit} is not tagged by ${GITHUB_REF_NAME}."
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "Release validation requires refs/remotes/origin/main."
            exit 1
          fi
          if ! git merge-base --is-ancestor \
            "$head_commit" refs/remotes/origin/main; then
            echo "Tagged commit ${head_commit} is not contained in origin/main."
            exit 1
          fi

      - name: Run repository release checks
        run: make release-check

      - name: Build non-publishing release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean --timeout 60m

      - name: Verify snapshot archives, checksums, and binary identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(dist/*.tar.gz dist/*.zip)
          linux_archives=(dist/*_Linux_x86_64.tar.gz)
          if [[ "${#linux_archives[@]}" -ne 1 ]]; then
            echo "expected exactly one Linux x86_64 archive"
            exit 1
          fi
          archive_prefix="${linux_archives[0]%_Linux_x86_64.tar.gz}"
          snapshot_version="${archive_prefix#dist/tested_}"
          expected_archives=(
            "${archive_prefix}_Darwin_arm64.tar.gz"
            "${archive_prefix}_Darwin_x86_64.tar.gz"
            "${archive_prefix}_Linux_arm64.tar.gz"
            "${archive_prefix}_Linux_x86_64.tar.gz"
            "${archive_prefix}_Windows_arm64.zip"
            "${archive_prefix}_Windows_x86_64.zip"
          )
          if [[ "${#archives[@]}" -ne "${#expected_archives[@]}" ]]; then
            echo "expected ${#expected_archives[@]} release archives, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${expected_archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "GoReleaser did not produce expected archive $archive"
              exit 1
            fi
          done
          for archive in "${archives[@]}"; do
            case "$archive" in
              *.tar.gz) entries="$(tar -tzf "$archive")" ;;
              *.zip) entries="$(unzip -Z1 "$archive")" ;;
              *) echo "unsupported archive $archive"; exit 1 ;;
            esac
            binary="tested"
            if [[ "$archive" == *_Windows_* ]]; then
              binary="tested.exe"
            fi
            for required in \
              "$binary" LICENSE README.md SECURITY.md USER_GUIDE.md; do
              if ! grep -Fqx "$required" <<<"$entries"; then
                echo "$archive is missing $required"
                exit 1
              fi
            done
          done

          checksums=(dist/*_SHA256SUMS)
          if [[ "${#checksums[@]}" -ne 1 ]]; then
            echo "expected exactly one checksum file, found ${#checksums[@]}"
            exit 1
          fi
          (
            cd dist
            sha256sum --check "$(basename "${checksums[0]}")"
          )

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "${linux_archives[0]}" -C "$verify_dir"
          version_output="$("$verify_dir/tested" version)"
          grep -Fqx "tested ${snapshot_version}" <<<"$version_output"
          grep -Fqx "  commit: $(git rev-parse HEAD)" <<<"$version_output"
          grep -Eq \
            'built: [0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ by goreleaser' \
            <<<"$version_output"
          "$verify_dir/tested" help >/dev/null

      - name: Confirm preflight left the checkout clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "Release preflight modified the checkout:"
            echo "$status"
            exit 1
          fi

  native-lifecycle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release macOS process-tree runtime
            os: macos-latest
          - name: Release Windows process-tree runtime
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Exercise native runner lifecycle
        run: go test -count=1 ./pkg/runner

      - name: Test and build complete native module
        run: |
          go test ./...
          go build ./...

  goreleaser:
    name: GoReleaser
    needs:
      - preflight
      - native-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
